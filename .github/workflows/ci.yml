---
name: ci

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: false
        default: ""
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.revision }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_AUTO_INSTALL: "false"

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.selection.outputs.native }}
      proofs: ${{ steps.selection.outputs.proofs }}
      features: ${{ steps.selection.outputs.features }}
      package: ${{ steps.selection.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          base: ${{ github.event.merge_group.base_sha || github.event.repository.default_branch }}
          filters: .github/filters/ci.yml
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde  # v5.2.1
        with:
          version: v2026.10.13
          install_args: >-
            rust node python uv just github:crate-ci/typos actionlint yamllint jq
            npm:markdownlint-cli2 github:EmbarkStudios/cargo-deny github:crate-ci/committed ripgrep
      - name: Select checks
        id: selection
        env:
          FULL: ${{ inputs.revision != '' }}
          NATIVE: ${{ steps.changes.outputs.native }}
          PROOFS: ${{ steps.changes.outputs.proofs }}
          FEATURES: ${{ steps.changes.outputs.features }}
          PACKAGE: ${{ steps.changes.outputs.package }}
          CONTRACT: >-
            [$full, $native, $proofs, $features, $package] as $flags |
            if all($flags[]; IN("true", "false")) then
              {native: ($full == "true" or $native == "true"),
               proofs: ($full == "true" or $proofs == "true"),
               features: ($full == "true" or $features == "true"),
               package: ($full == "true" or $package == "true")} |
              to_entries[] | "\(.key)=\(.value)"
            else error("invalid selection flags") end
        run: |
          jq -ern --arg full "$FULL" --arg native "$NATIVE" --arg proofs "$PROOFS" \
            --arg features "$FEATURES" --arg package "$PACKAGE" "$CONTRACT" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - run: mise x -- just fmt-check clippy strict-code test docs typos actionlint yamllint markdownlint audit
      - name: Check Conventional Commits
        if: github.event_name == 'pull_request' && !endsWith(github.event.pull_request.user.login, '[bot]')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git rev-list --no-merges "$BASE..$HEAD" | xargs -rn1 mise x -- committed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: verification-portable
          path: |
            target/verification/
            !target/verification/**/target/**

  windows:
    name: Windows native smoke
    needs: [portable]
    if: needs.portable.outputs.native == 'true'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo +1.85.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test native Task Scheduler operations
        env:
          WINDOWS_TASK_MUTATION_TESTS: "1"
          WINDOWS_TASK_CLEAR_EVENT_LOG: "1"
          WINDOWS_TASK_ACCOUNT_TESTS: "1"
        run: cargo +1.85.0 xtask test --suite all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: verification-windows-x64
          path: |
            target/verification/
            !target/verification/**/target/**

  windows-arm64:
    name: Windows ARM64 native
    needs: [portable]
    if: needs.portable.outputs.native == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Select the native ARM64 MSRV host
        run: |
          rustup set default-host aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.85.0 --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = rustc +1.85.0 --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($compiler -notcontains 'host: aarch64-pc-windows-msvc') {
            throw 'ARM64 execution requires an ARM64 compiler host'
          }
          if ($env:CARGO_BUILD_TARGET) { throw 'Unexpected target override on native ARM64' }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo +1.85.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Execute native ARM64 suites
        env:
          WINDOWS_TASK_MUTATION_TESTS: "1"
          WINDOWS_TASK_CLEAR_EVENT_LOG: "1"
          WINDOWS_TASK_ACCOUNT_TESTS: "1"
        run: cargo +1.85.0 xtask test --suite all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: verification-windows-arm64
          path: |
            target/verification/
            !target/verification/**/target/**

  proofs:
    name: Implementation proofs
    needs: [portable]
    if: needs.portable.outputs.proofs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde  # v5.2.1
        with:
          version: v2026.10.13
          install_args: rust
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned verifier
        run: cargo +stable install --locked kani-verifier --version 0.68.0
      - run: cargo kani setup
      - run: mise x -- cargo xtask prove
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: verification-proofs
          path: |
            target/verification/
            !target/verification/**/target/**

  features:
    name: Isolated features
    needs: [portable]
    if: needs.portable.outputs.features == 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo +1.85.0 xtask features
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: verification-features
          path: |
            target/verification/
            !target/verification/**/target/**

  package:
    name: Package consumers
    needs: [portable]
    if: needs.portable.outputs.package == 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo +1.85.0 xtask package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: verification-packages
          path: |
            target/verification/
            !target/verification/**/target/**

  required:
    name: required
    if: always()
    needs: [portable, windows, windows-arm64, proofs, features, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check selected results
        env:
          RESULTS: ${{ toJSON(needs) }}
          CONTRACT: >-
            . as $needs |
            type == "object" and
            keys == ["features", "package", "portable", "proofs", "windows", "windows-arm64"] and
            .portable.result == "success" and
            (.portable.outputs as $outputs |
             all(["native", "proofs", "features", "package"][];
                 $outputs[.] | IN("true", "false")) and
             all(["windows", "windows-arm64", "proofs", "features", "package"][];
                 . as $job |
                 (if IN("windows", "windows-arm64") then "native" else . end) as $flag |
                 $needs[$job].result ==
                   (if $outputs[$flag] == "true" then "success" else "skipped" end)))
        run: jq -e "$CONTRACT" <<< "$RESULTS"
