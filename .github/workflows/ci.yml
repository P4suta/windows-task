---
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  portable:
    name: Portable + cross-target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install Windows Rust targets
        run: >-
          rustup target add --toolchain 1.85.0
          x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - run: just ci

  windows:
    name: Windows native smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MSRV toolchain
        shell: pwsh
        run: >-
          rustup toolchain install 1.85.0 --profile minimal
          --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test native Task Scheduler operations
        shell: pwsh
        env:
          WINDOWS_TASK_MUTATION_TESTS: "1"
        run: cargo +1.85.0 test --workspace --all-features
      - name: Clippy on the native target
        shell: pwsh
        run: >-
          cargo +1.85.0 clippy --workspace --all-targets --all-features
          -- -D warnings
