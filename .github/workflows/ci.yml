---
name: ci

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: false
        default: ""
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  portable:
    name: Portable + cross-target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Install MSRV toolchain
        run: >-
          rustup toolchain install 1.85.0 --profile minimal
          --component clippy --component rustfmt --component rust-src
          --component llvm-tools-preview
      - uses: jdx/mise-action@v4
        with:
          install_args: >-
            node just github:crate-ci/typos actionlint yamllint
            npm:markdownlint-cli2 github:EmbarkStudios/cargo-deny ripgrep
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Windows Rust targets
        run: >-
          rustup target add --toolchain 1.85.0
          x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - run: just ci
      - run: cargo +1.85.0 xtask package
      - name: Coverage (portable)
        run: just coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-portable
          path: |
            target/verification/
            !target/verification/**/target/**

  windows:
    name: Windows native smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Install MSRV toolchain
        shell: pwsh
        run: >-
          rustup toolchain install 1.85.0 --profile minimal
          --component clippy --component rustfmt --component llvm-tools-preview
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - uses: jdx/mise-action@v4
        with:
          install_args: >-
            node just github:crate-ci/typos actionlint yamllint
            npm:markdownlint-cli2 github:EmbarkStudios/cargo-deny ripgrep
      - name: Install ARM64 compilation target
        run: rustup target add --toolchain 1.85.0 aarch64-pc-windows-msvc
      - name: Test native Task Scheduler operations
        shell: pwsh
        env:
          WINDOWS_TASK_MUTATION_TESTS: "1"
          WINDOWS_TASK_CLEAR_EVENT_LOG: "1"
          WINDOWS_TASK_ACCOUNT_TESTS: "1"
        run: cargo +1.85.0 xtask ci --suite all
      - name: Verify package consumers on Windows
        run: cargo +1.85.0 xtask package
      - name: Coverage (Windows, reported separately from portable floor)
        run: cargo +1.85.0 xtask coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-windows-x64
          path: |
            target/verification/
            !target/verification/**/target/**

  windows-arm64:
    name: Windows ARM64 native
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Select the native ARM64 MSRV host
        run: |
          rustup set default-host aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = rustc +1.85.0 --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler
          if ($compiler -notcontains 'host: aarch64-pc-windows-msvc') {
            throw 'ARM64 execution requires an ARM64 compiler host'
          }
          if ($env:CARGO_BUILD_TARGET) { throw 'Unexpected target override on native ARM64' }
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            v2-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Execute all suites on ARM64
        env:
          WINDOWS_TASK_MUTATION_TESTS: "1"
          WINDOWS_TASK_CLEAR_EVENT_LOG: "1"
          WINDOWS_TASK_ACCOUNT_TESTS: "1"
        run: cargo +1.85.0 xtask test --suite all
      - name: Execute ARM64 package consumers
        run: cargo +1.85.0 xtask package
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-windows-arm64
          path: |
            target/verification/
            !target/verification/**/target/**
