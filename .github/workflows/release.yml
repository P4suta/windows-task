---
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.resolve.outputs.revision }}

  build:
    needs: [resolve, verify]
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.revision }}
      - name: Install Rust target
        shell: pwsh
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add --toolchain 1.85.0 ${{ matrix.target }}
      - name: Verify tag matches the workspace version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $releaseTag = $env:RELEASE_TAG
          $metadata = cargo +1.85.0 metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "windows-task" }).version
          if ($releaseTag -ne "v$version") {
            throw "release tag $releaseTag does not match workspace version $version"
          }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build CLI
        shell: pwsh
        run: >-
          cargo +1.85.0 build --locked --release -p windows-task-cli
          --target ${{ matrix.target }}
      - name: Package archive and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item "target/${{ matrix.target }}/release/windows-task.exe" dist/
          Copy-Item LICENSE-APACHE, LICENSE-MIT, NOTICE, README.md dist/
          @{
            revision = (git rev-parse HEAD)
            target = '${{ matrix.target }}'
            x64_native_suite_required = $true
            this_architecture_executed = ('${{ matrix.target }}' -eq 'x86_64-pc-windows-msvc')
            remote_execution_verified = $false
            verification_run = '${{ github.run_id }}'
          } | ConvertTo-Json | Set-Content -Encoding utf8 dist/VERIFICATION.json
          $archive = "windows-task-${{ matrix.name }}.zip"
          Compress-Archive -Path dist/* -DestinationPath $archive
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$checksum  $archive" | Out-File -Encoding ascii "$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: |
            windows-task-${{ matrix.name }}.zip
            windows-task-${{ matrix.name }}.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    environment: release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Complete an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft \
              | jq --exit-status '.isDraft == true'
            cargo +1.85.0 xtask upload-draft --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --artifacts artifacts
          else
            gh release create "$RELEASE_TAG" artifacts/* --draft --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --tag "$RELEASE_TAG" \
            --verify-tag --repo "$GITHUB_REPOSITORY"
