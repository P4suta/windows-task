---
name: commitlint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    # Skip PRs opened by any bot account (a login ending in `[bot]`, such as `renovate[bot]`).
    # Renovate writes lowercase Conventional subjects (`build(deps): update … to v2`),
    # which this repository's capitalized-subject rule and 50/72 limits reject,
    # and a bot cannot be asked to reword its commits.
    # A skipped job reports success, so the skip never blocks a required check or an automerge.
    # Guard on the PR *author*, not `github.actor`,
    # so a maintainer's `gh pr update-branch` on a bot PR cannot flip the guard.
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install_args: github:crate-ci/committed
      # Lint only the non-merge commits. `committed` flags any merge
      # commit ("Merge branch 'main' …") as "Missing type", so a
      # `gh pr update-branch` merge must never reach it. And `committed`
      # takes a single revspec, so feed the SHAs one per invocation
      # (`-rn1`): a multi-commit PR would otherwise pass several
      # positionals at once and abort with "unexpected argument".
      - name: Check Conventional Commits (committed)
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git rev-list --no-merges "$base..$head" | xargs -rn1 committed
